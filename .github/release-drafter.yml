# Shared release-drafter config.
#
# Both invocations of `semantic-pr-release-drafter` in
# `.github/workflows/release-drafter.yml` (the initial "not ready" draft and the
# finalize pass) read this file, so the release body is rendered identically on
# each pass. Keep the templates here rather than inline in the workflow.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER)'
categories:
  - title: '⚠️ Breaking Changes'
    commit-types: [breaking]
    commit-scopes: []
    collapse-after: 0
  - title: '🔌 Resource and Data Source Updates'
    commit-types: [chore]
    commit-scopes: [api]
    collapse-after: 0
  - title: '✨ New Features'
    commit-types: [feat]
    commit-scopes: []
    collapse-after: 0
  - title: '🐛 Bug Fixes'
    commit-types: [fix]
    commit-scopes: []
    collapse-after: 0
  - title: '▲ Other Changes'
    commit-types: [refactor, perf, style]
    commit-scopes: []
    collapse-after: 2
  - title: '📖 Documentation'
    commit-types: [docs]
    commit-scopes: []
    collapse-after: 2
  - title: '⚙️ Under the Hood'
    commit-types: [chore, build, revert, infra]
    commit-scopes: []
    collapse-after: 2
  # Omitted from release notes; on their own they don't refresh the draft.
  - title: '🤖 CI and Tests'
    commit-types: [ci, test]
    commit-scopes: []
    hidden: true
template: |
  ## Changes

  $CHANGES

  ## Terraform Registry

  This provider is automatically published to the Terraform Registry:
  - [`airbytehq/airbyte/$RESOLVED_VERSION`](https://registry.terraform.io/providers/airbytehq/airbyte/$RESOLVED_VERSION/docs)

  ## Installation

  ```hcl
  terraform {
    required_providers {
      airbyte = {
        source  = "airbytehq/airbyte"
        version = "$RESOLVED_VERSION"
      }
    }
  }
  ```
